<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sonic — profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <div class="vignette"></div>
  <div class="noise"></div>

  <div id="enter" class="enter-screen">
    <div class="enter-box">
      <div class="enter-dot"></div>
      <div>click to enter</div>
      <span>sonic</span>
    </div>
  </div>

  <main class="profile">
    <div class="avatar-wrap">
      <img src="profile.png" class="avatar" alt="Sonic">
      <span class="online"></span>
    </div>

    <h1>sonic <span class="verified">◆</span></h1>

    <p id="typewriter" class="description"></p>

    <div class="links">
      <a class="link discord" href="https://discord.gg/6FDqbqtTc" target="_blank" rel="noopener">Discord <span>↗</span></a>
      <a class="link" href="https://www.tiktok.com/@krayz.s.8" target="_blank" rel="noopener">TikTok <span>↗</span></a>
      <a class="link" href="https://www.youtube.com/watch?v=wBkfLkJ96_s" target="_blank" rel="noopener">Musique <span>↗</span></a>
    </div>

    <div class="meta">
      <span>◉ <b id="views">0</b></span>
      <span>⌖ BE</span>
    </div>

    <div class="music-card">
      <div class="music-icon">♫</div>
      <div class="music-info">
        <strong>Bones — HDML</strong>
        <small>slowed + reverb</small>
      </div>
      <a class="music-open" href="https://www.youtube.com/watch?v=wBkfLkJ96_s&list=RDwBkfLkJ96_s&start_radio=1" target="_blank" rel="noopener" aria-label="Ouvrir la musique sur YouTube">↗</a>
      <button id="playBtn" aria-label="Lecture">▶</button>
    </div>

    <audio id="audio" preload="metadata">
  <source src="TONFICHIER.mp3" type="audio/mpeg">
</audio>
      <!-- Ajoute ici un fichier audio dont tu as les droits, par exemple: music.mp3 -->
    </audio>
  </main>

  <script src="script.js"></script>
</body>
</html>
